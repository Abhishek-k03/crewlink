<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrewLink — Fleet Crew Rotation &amp; Certification Management</title>
    <meta
      name="description"
      content="Crew rotation, assignment planning and certification compliance for a small fleet."
    />
    <meta name="theme-color" content="#0B1F33" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Applies the theme before first paint. Deferring this to React would show
         a flash of the wrong theme while the bundle loads. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('crewlink.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          /* Storage unavailable; fall through to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
